       <div class="flex flex-wrap gap-4 bg-white p-4 rounded-lg shadow mb-6" dir="rtl">
    
    <div class="flex flex-col">
        <label for="goals-period-select" class="text-xs font-bold text-gray-600 mb-1">תקופה:</label>
        <select id="goals-period-select" class="border rounded p-2 text-sm bg-gray-50 min-w-[130px]">
            <option value="ALL">כל התקופות</option>
        </select>
    </div>

    <div class="flex flex-col">
        <label for="goals-week-select" class="text-xs font-bold text-gray-600 mb-1">שבוע בתקופה:</label>
        <select id="goals-week-select" class="border rounded p-2 text-sm bg-gray-50 min-w-[100px]">
            <option value="">כל השבועות</option>
            <option value="1">שבוע 1</option>
            <option value="2">שבוע 2</option>
            <option value="3">שבוע 3</option>
            <option value="4">שבוע 4</option>
            <option value="5">שבוע 5</option>
            <option value="6">שבוע 6</option>
            </select>
    </div>

    <div class="flex flex-col">
        <label for="goals-filter-flight-type" class="text-xs font-bold text-gray-600 mb-1">סוג גיחה:</label>
        <select id="goals-filter-flight-type" class="border rounded p-2 text-sm bg-gray-50 min-w-[130px]">
            <option value="">כל הסוגים</option>
        </select>
    </div>

    <div class="flex flex-col">
        <label for="goals-pop-type" class="text-xs font-bold text-gray-600 mb-1">סיווג אוכלוסייה:</label>
        <select id="goals-pop-type" class="border rounded p-2 text-sm bg-gray-50 min-w-[140px]">
            <option value="">כל האוכלוסיות</option>
            <option value="courses">חניכים (קורסים)</option>
            <option value="instructors">מדריכים</option>
            <option value="conversion">הסבות</option>
        </select>
    </div>

    <div class="flex flex-col">
        <label for="goals-sub-pop" class="text-xs font-bold text-gray-600 mb-1">קבוצה ספציפית:</label>
        <select id="goals-sub-pop" class="border rounded p-2 text-sm bg-gray-50 min-w-[160px]" disabled>
            <option value="ALL">כל הקבוצות</option>
        </select>
    </div>
</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div id="stats-card-goals" class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-lg font-bold text-gray-700">עמידה ביעדים</h3>
                    <select id="stats-goal-flight-selector" class="text-sm border rounded p-1"
                        onchange="window.goalsManager && window.goalsManager.refreshGoalsChart()">
                        <option value="">כל הגיחות</option>
                    </select>
                </div>
                <div class="chart-wrapper h-[300px] w-full relative">
                    <canvas id="chart-goals-status"></canvas>
                </div>
            </div>

            <div id="stats-card-metrics-utilization" class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-lg font-bold text-gray-700">מיצוי מדדי ביצוע</h3>
                    <select id="stats-metric-selector" class="text-sm border rounded p-1"
                        onchange="window.goalsManager && window.goalsManager.refreshMetricsChart()">
                        <option value="">בחר מדד...</option>
                    </select>
                </div>
                <div class="chart-wrapper h-[300px] w-full relative">
                    <canvas id="chart-metrics-utilization"></canvas>
                </div>
            </div>
        </div>
    </div>
