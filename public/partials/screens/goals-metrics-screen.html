<div id="goals-metrics-screen" class="screen hidden">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">סטטיסטיקות ונתונים</h1>
    </div>

    <div class="bg-white rounded-lg shadow p-4 mb-8">
        <div class="flex flex-wrap items-end gap-4 border-b border-gray-100 pb-4">

            <div class="filter-group">
                <label class="block text-sm font-medium text-gray-700 mb-1">אוכלוסייה:</label>
                <select id="goals-pop-type" onchange="window.statsManager.updateGoalsSubPops()"
                    class="block w-48 rounded-md border-gray-300 shadow-sm focus:border-ofer-orange">
                    <option value="">כלל האוכלוסיות</option>
                    <option value="students">חניכים</option>
                    <option value="instructors">מדריכים</option>
                    <option value="conversion">הסבה</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="block text-sm font-medium text-gray-700 mb-1">קבוצה/קורס:</label>
                <select id="goals-sub-pop" onchange="window.statsManager.refreshGoalsAndMetrics()" disabled
                    class="block w-48 rounded-md border-gray-300 shadow-sm focus:border-ofer-orange disabled:bg-gray-100">
                    <option value="">כל הקבוצות</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="block text-sm font-medium text-gray-700 mb-1">סוג גיחה:</label>
                <select id="goals-filter-flight-type" onchange="window.statsManager.refreshGoalsAndMetrics()"
                    class="block w-48 rounded-md border-gray-300 shadow-sm focus:border-ofer-orange">
                    <option value="">כל הסוגים</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <div id="stats-card-goals" class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-lg font-bold text-gray-700">עמידה ביעדים</h3>
                    <select id="stats-goal-flight-selector" class="text-sm border rounded p-1"
                        onchange="window.statsManager.refreshGoalsChart()">
                        <option value="">כל הגיחות</option>
                    </select>
                </div>
                <div class="chart-wrapper h-[300px] w-full relative">
                    <canvas id="chart-goals-status"></canvas>
                </div>
            </div>

            <div id="stats-card-metrics-utilization" class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-lg font-bold text-gray-700">מיצוי מדדי ביצוע</h3>
                    <select id="stats-metric-selector" class="text-sm border rounded p-1"
                        onchange="window.statsManager.refreshMetricsChart()">
                        <option value="">בחר מדד...</option>
                    </select>
                </div>
                <div class="chart-wrapper h-[300px] w-full relative">
                    <canvas id="chart-metrics-utilization"></canvas>
                </div>
            </div>
        </div>
    </div>
